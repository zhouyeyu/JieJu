name: 模型讲解问题
description: 报告翻译、语法、句法、词义或结构化输出问题
title: "[Model] "
labels: ["model-quality", "needs-triage"]
body:
  - type: input
    id: model
    attributes:
      label: Provider 与模型
      placeholder: 例如 Ollama / qwen2.5:1.5b-instruct
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: 原文语言
      options:
        - 英语
        - 日语
        - 其他
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 最小输入
      description: 只提供重现问题所需的短句和有限上下文。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际讲解
      description: 可粘贴错误部分、解析错误或超时信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与依据
      description: 请说明更准确的翻译或语法分析；有可靠参考资料时可附链接。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 内容确认
      options:
        - label: 输入是自编、公有领域或合理的最小引用，不含私人信息。
          required: true

name: 缺陷报告
description: 报告可以稳定复现的应用问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传 API Key、私人书籍或包含个人信息的截图。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期待什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 选择…
        3. 看到…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JieJu 版本或提交
      placeholder: 例如 0.1.0 / git commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: 例如 macOS 15.6, M2, Ollama 0.x
    validations:
      required: true
  - type: dropdown
    id: document_type
    attributes:
      label: 文档类型
      options:
        - PDF
        - EPUB
        - 不涉及文档
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选。请先脱敏，并尽量提供最小信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，没有发现相同报告。
          required: true
        - label: 我确认附件不含密钥、私人数据或无权公开的书籍内容。
          required: true

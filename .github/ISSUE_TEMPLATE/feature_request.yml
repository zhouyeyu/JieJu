name: 功能建议
description: 提议符合“从阅读中学习语言”的改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述阅读或学习中的真实困难，而不仅是界面方案。
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁会在什么时候使用它？完整流程是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以包含替代方案和你愿意接受的取舍。
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: 产品原则
      options:
        - label: 这个建议不会用提醒、连续打卡或惩罚制造学习压力。
          required: true
        - label: 我已搜索现有 Issue 和 TODO。
          required: true

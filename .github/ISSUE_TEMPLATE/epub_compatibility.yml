name: EPUB 兼容性问题
description: 报告空白页、分页、样式、选区或资源加载问题
title: "[EPUB] "
labels: ["epub", "compatibility", "needs-triage"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 现象与复现步骤
    validations:
      required: true
  - type: textarea
    id: structure
    attributes:
      label: EPUB 结构线索
      description: 请提供最小 OPF / XHTML / CSS 片段、排版方式或校验器结果，不要上传整本受版权保护书籍。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: JieJu 版本与 macOS
      placeholder: 例如 commit SHA, macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: 影响范围
      options:
        - 全书空白或无法打开
        - 部分章节或资源异常
        - 分页或版式异常
        - 选区、注音或解释异常
        - 阅读位置恢复异常
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: 素材确认
      options:
        - label: 我不会公开上传无权再分发的电子书或大段正文。
          required: true
